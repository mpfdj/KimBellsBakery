<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KimBel's bakery</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/footer.css">

    <!-- Standaard favicon voor moderne browsers -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <!-- Fallback voor oudere browsers -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <!-- Javascript -->
    <script src="js/hamburger-menu.js" defer></script>
    <script src="js/cart-badge.js" defer></script>
</head>

<body>

    <!-- Navigatiebalk -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="images/icon-transp.png" alt="KimBel's bakery icon" class="icon">
            KimBel's <span>bakery</span>
        </a>

        <!-- Wrapper voor cart + hamburger -->
        <div class="nav-actions">
            <div class="cart-icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="count" id="cart-count">0</span>
            </div>

            <!-- Hamburger knop -->
            <button class="hamburger" id="hamburger" aria-label="Menu openen/sluiten">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

    </nav>

    <!-- Menu items -->
    <div class="nav-menu" id="navMenu">
        <a href="index.html">Home</a>
        <a href="shopping.html">Bestellen</a>
        <a href="about.html">Over mij</a>
        <a href="contact.html">Contact</a>
    </div>


    <!-- Hero sectie -->
    <main>
        <section class="hero" id="hero">
            <div class="container">
                <h1>Welkom bij KimBel's bakery</h1>
                <a href="shopping.html" class="btn btn-primary">Bestel nu</a>
            </div>
        </section>
    </main>

</body>

<footer>
    <div class="container">
        <p>© 2026 <a href="#">KimBel's bakery</a> - Gebakken met passie</p>
    </div>
</footer>

</html>
